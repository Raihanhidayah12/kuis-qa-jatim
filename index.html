<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q&A TOP 3 - Duta Budaya Jawa Timur</title>
  
  <!-- Font Google: Cinzel & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #120303 0%, #2a0808 40%, #1f0505 100%);
      --card-bg: linear-gradient(145deg, #b81d13 0%, #800e08 100%);
      --card-bg-selected: linear-gradient(145deg, #2b2b2b 0%, #141414 100%);
      --gold-primary: #f3c669;
      --gold-gradient: linear-gradient(135deg, #ffe89e 0%, #f1be48 50%, #b8860b 100%);
      --gold-border: rgba(243, 198, 105, 0.4);
      --text-light: #fff3e0;
      --terracotta: #d34e29;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Custom Smooth Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #120303;
    }
    ::-webkit-scrollbar-thumb {
      background: #800e08;
      border-radius: 4px;
      border: 1px solid var(--gold-border);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    .batik-overlay {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(243, 198, 105, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 1;
    }

    .app-wrapper {
      width: 100%;
      max-width: 900px;
      padding: 2rem 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      flex: 1;
    }

    .header-panel {
      text-align: center;
      margin-bottom: 2rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .surya-majapahit-icon {
      width: 50px;
      height: 50px;
      margin: 0 0 0.5rem 0;
      filter: drop-shadow(0 0 10px rgba(243, 198, 105, 0.6));
      animation: pulseGlow 3s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      from { transform: scale(0.95); filter: drop-shadow(0 0 8px rgba(243, 198, 105, 0.4)); }
      to { transform: scale(1.05); filter: drop-shadow(0 0 18px rgba(243, 198, 105, 0.8)); }
    }

    .header-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      line-height: 1.1;
    }

    .header-subtitle {
      font-size: clamp(0.8rem, 2vw, 1rem);
      color: #d1b894;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 0.4rem;
      font-weight: 600;
    }

    .action-toolbar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--gold-border);
      color: var(--gold-primary);
      padding: 0.7rem 1.6rem;
      border-radius: 50px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }

    .btn-action:hover {
      background: var(--gold-gradient);
      color: #1a0303;
      border-color: transparent;
      box-shadow: 0 0 15px rgba(243, 198, 105, 0.4);
      transform: translateY(-2px);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      width: 100%;
      perspective: 1000px;
      margin-bottom: 2rem;
    }

    @media (max-width: 640px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
    }

    .quiz-card {
      aspect-ratio: 1.25 / 1;
      border-radius: 16px;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .quiz-card-inner {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: var(--card-bg);
      border: 2px solid var(--gold-border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 215, 0, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .quiz-card-inner::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px dashed rgba(243, 198, 105, 0.35);
      border-radius: 12px;
      pointer-events: none;
    }

    .card-number {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.5rem, 6vw, 3.8rem);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
    }

    .card-status-badge {
      position: absolute;
      bottom: 10px;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .quiz-card:not(.selected):hover {
      transform: translateY(-6px) scale(1.03);
    }

    .quiz-card:not(.selected):hover .quiz-card-inner {
      border-color: var(--gold-primary);
      box-shadow: 0 15px 30px rgba(184, 29, 19, 0.6), 0 0 20px rgba(243, 198, 105, 0.4);
    }

    .quiz-card.highlighted {
      transform: scale(1.08) translateY(-6px);
      z-index: 10;
    }

    .quiz-card.highlighted .quiz-card-inner {
      background: var(--gold-gradient);
      border-color: #ffffff;
      box-shadow: 0 0 30px rgba(255, 232, 158, 0.9);
    }

    .quiz-card.highlighted .card-number {
      color: #1a0303;
    }

    .quiz-card.selected {
      cursor: default;
    }

    .quiz-card.selected .quiz-card-inner {
      background: var(--card-bg-selected);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .quiz-card.selected .card-number {
      color: #555555;
      text-shadow: none;
    }

    .quiz-card.selected .card-status-badge {
      opacity: 1;
      background: rgba(255, 255, 255, 0.1);
      color: #aaa;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .quiz-card.card-flip-anim {
      animation: flip360 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes flip360 {
      0% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(180deg) scale(0.9); }
      100% { transform: rotateY(360deg) scale(1); }
    }

    .quiz-card.shine-effect .quiz-card-inner::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.4) 50%, transparent 70%);
      transform: rotate(30deg);
      animation: shineSweep 0.8s ease-in-out;
    }

    @keyframes shineSweep {
      0% { transform: translate(-100%, -100%) rotate(30deg); }
      100% { transform: translate(100%, 100%) rotate(30deg); }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 2, 2, 0.88);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: linear-gradient(160deg, #2c0b0a 0%, #170404 100%);
      border: 2px solid var(--gold-primary);
      border-radius: 24px;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(243, 198, 105, 0.25);
      transform: scale(0.85) translateY(30px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-header-banner {
      background: var(--gold-gradient);
      color: #1a0303;
      padding: 1rem 1.5rem;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      letter-spacing: 2px;
      border-bottom: 2px solid rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .modal-body {
      padding: 2.2rem 2rem;
      max-height: 60vh;
      overflow-y: auto;
    }

    .question-text {
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      line-height: 1.7;
      color: #fff8eb;
      font-weight: 600;
      text-align: center;
    }

    .modal-footer {
      padding: 1.2rem 2rem 1.8rem;
      display: flex;
      justify-content: center;
      border-top: 1px solid rgba(243, 198, 105, 0.15);
    }

    .btn-selesai {
      background: var(--gold-gradient);
      color: #1f0505;
      border: none;
      padding: 0.85rem 3.5rem;
      border-radius: 50px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(243, 198, 105, 0.4);
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }

    .btn-selesai:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(243, 198, 105, 0.7);
    }

    .cultural-footer-svg {
      width: 100%;
      height: 90px;
      z-index: 2;
      display: block;
      pointer-events: none;
    }

    .toast-msg {
      position: fixed;
      top: 20px;
      background: var(--gold-gradient);
      color: #1a0303;
      padding: 0.7rem 1.6rem;
      border-radius: 30px;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 200;
      transform: translateY(-80px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast-msg.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="batik-overlay"></div>
  <div id="toast" class="toast-msg">Kuis telah di-reset!</div>

  <div class="app-wrapper">
    <header class="header-panel">
      <svg class="surya-majapahit-icon" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="22" fill="url(#goldGrad)" />
        <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round">
          <line x1="50" y1="5" x2="50" y2="20" />
          <line x1="50" y1="80" x2="50" y2="95" />
          <line x1="5" y1="50" x2="20" y2="50" />
          <line x1="80" y1="50" x2="95" y2="50" />
          <line x1="18" y1="18" x2="29" y2="29" />
          <line x1="71" y1="71" x2="82" y2="82" />
          <line x1="18" y1="82" x2="29" y2="71" />
          <line x1="71" y1="29" x2="82" y2="18" />
        </g>
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffe89e" />
            <stop offset="50%" stop-color="#f1be48" />
            <stop offset="100%" stop-color="#b8860b" />
          </linearGradient>
        </defs>
      </svg>
      <h1 class="header-title">Q&A TOP 3</h1>
      <p class="header-subtitle">Duta Budaya Jawa Timur</p>
    </header>

    <div class="action-toolbar">
      <button class="btn-action" id="btnRandom">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        Pilih Random
      </button>
      <button class="btn-action" id="btnReset">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Reset Kuis
      </button>
    </div>

    <main class="cards-grid" id="cardsGrid"></main>
  </div>

  <div class="modal-overlay" id="questionModal">
    <div class="modal-card">
      <div class="modal-header-banner">
        <span id="modalTitle">PERTANYAAN NOMOR 1</span>
      </div>
      <div class="modal-body">
        <p class="question-text" id="modalQuestionText">Isi pertanyaan...</p>
      </div>
      <div class="modal-footer">
        <button class="btn-selesai" id="btnSelesai">Selesai</button>
      </div>
    </div>
  </div>

  <!-- Decorative Cultural SVG Footer -->
  <svg class="cultural-footer-svg" viewBox="0 0 1200 160" preserveAspectRatio="none" fill="none">
    <path d="M0,160 L0,120 Q60,110 120,130 T240,120 T360,135 T480,115 T600,130 T720,110 T840,130 T960,115 T1080,130 Q1140,110 1200,125 L1200,160 Z" fill="#170303"/>
    <g transform="translate(10, 20)">
      <polygon points="50,140 10,140 15,90 25,90 20,50 35,50 30,10 50,20" fill="#3a0d0d" stroke="#f3c669" stroke-width="1.5"/>
      <polygon points="60,140 100,140 95,90 85,90 90,50 75,50 80,10 60,20" fill="#3a0d0d" stroke="#f3c669" stroke-width="1.5"/>
    </g>
    <g transform="translate(1070, 10)">
      <path d="M20,130 Q50,40 80,130 Q60,10 10,130 Z" fill="#3a0d0d" stroke="#f3c669" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="12" fill="#d34e29"/>
    </g>
    <path d="M0,160 L1200,160" stroke="#f3c669" stroke-width="3"/>
  </svg>

  <script>
    const questionsData = [
      "“AI kini mampu merekonstruksi suara sinden, menciptakan komposisi musik tradisional, menghasilkan motif batik, bahkan membuat representasi digital tokoh dan kesenian daerah. Jika sebuah karya budaya dihasilkan oleh AI berdasarkan ribuan data budaya Jawa Timur, apakah kita sedang melestarikan budaya atau justru mengubah budaya menjadi sekadar data? Jelaskan batas yang menurut Anda tidak boleh dilewati.”",
      "“Tidak semua warisan budaya dapat dipertahankan dalam bentuk aslinya. Jika suatu tradisi memiliki nilai sejarah yang tinggi tetapi sebagian praktiknya sudah tidak sesuai dengan prinsip kehidupan masyarakat modern, apakah tugas Duta Budaya adalah mempertahankannya, mengubahnya, atau membiarkannya hilang secara alamiah?”",
      "“Jika sebuah budaya hanya dapat bertahan dengan mengubah sebagian nilai, bentuk, dan praktik aslinya, apakah lebih baik budaya tersebut berubah agar tetap hidup, atau tetap autentik meskipun perlahan ditinggalkan?”",
      "“Bayangkan 50 tahun dari sekarang, generasi Jawa Timur masih memainkan kesenian tradisional, tetapi dengan musik yang dibuat AI, kostum yang dirancang algoritma, pertunjukan melalui virtual reality, dan bahasa yang sudah mengalami banyak perubahan. Apakah yang bertahan itu masih dapat kita sebut sebagai budaya Jawa Timur, atau hanya interpretasi baru atas budaya tersebut? Di mana letak ‘jiwa’ sebuah budaya menurut Anda?”",
      "“Ketika kita berbicara tentang ‘budaya Jawa Timur’, sebenarnya budaya siapa yang sedang kita representasikan? Sebagai Duta Budaya, bagaimana Anda memastikan bahwa representasi budaya Jawa Timur tidak membuat satu kelompok terlihat lebih penting dibandingkan kelompok lainnya?”",
      "“Sebuah gerbang pada dasarnya adalah ruang perlintasan: orang datang, orang pergi, dan sesuatu terus berubah. Jika Jawa Timur benar-benar menjadi ‘Gerbang Baru Nusantara’, bagaimana Anda memastikan bahwa keterbukaan terhadap dunia tidak membuat Jawa Timur kehilangan identitasnya, tetapi juga tidak membuatnya menjadi wilayah yang tertutup terhadap perubahan?”"
    ];

    let selectedCards = new Set();
    let isRolling = false;
    let currentCardIndex = null;

    const cardsGrid = document.getElementById('cardsGrid');
    const questionModal = document.getElementById('questionModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalQuestionText = document.getElementById('modalQuestionText');
    const btnSelesai = document.getElementById('btnSelesai');
    const btnRandom = document.getElementById('btnRandom');
    const btnReset = document.getElementById('btnReset');
    const toast = document.getElementById('toast');

    function initCards() {
      cardsGrid.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        if (selectedCards.has(i)) {
          card.classList.add('selected');
        }
        card.dataset.index = i;
        card.innerHTML = `
          <div class="quiz-card-inner">
            <span class="card-number">${i + 1}</span>
            <span class="card-status-badge">Telah Dipilih</span>
          </div>
        `;
        card.addEventListener('click', () => handleCardClick(i));
        cardsGrid.appendChild(card);
      }
    }

    function handleCardClick(index) {
      if (selectedCards.has(index) || isRolling) return;
      openQuestionModal(index);
    }

    function openQuestionModal(index) {
      currentCardIndex = index;
      modalTitle.textContent = `PERTANYAAN NOMOR ${index + 1}`;
      modalQuestionText.textContent = questionsData[index];
      questionModal.classList.add('active');
    }

    btnSelesai.addEventListener('click', () => {
      if (currentCardIndex === null) return;

      questionModal.classList.remove('active');

      const card = cardsGrid.children[currentCardIndex];
      selectedCards.add(currentCardIndex);

      card.classList.add('selected', 'shine-effect', 'card-flip-anim');
      setTimeout(() => {
        card.classList.remove('shine-effect', 'card-flip-anim');
      }, 800);

      currentCardIndex = null;
    });

    btnRandom.addEventListener('click', () => {
      if (isRolling) return;

      const unselectedIndexes = [];
      for (let i = 0; i < 6; i++) {
        if (!selectedCards.has(i)) unselectedIndexes.push(i);
      }

      if (unselectedIndexes.length === 0) {
        showToast('Semua kartu telah dipilih!');
        return;
      }

      isRolling = true;
      let speed = 80;
      let counter = 0;
      const totalRounds = 18 + Math.floor(Math.random() * 6);
      let lastIndex = -1;

      function rollStep() {
        if (lastIndex !== -1) {
          cardsGrid.children[lastIndex].classList.remove('highlighted');
        }

        const randomIndex = unselectedIndexes[Math.floor(Math.random() * unselectedIndexes.length)];
        cardsGrid.children[randomIndex].classList.add('highlighted');
        lastIndex = randomIndex;

        counter++;

        if (counter < totalRounds) {
          speed += 12;
          setTimeout(rollStep, speed);
        } else {
          setTimeout(() => {
            cardsGrid.children[lastIndex].classList.remove('highlighted');
            isRolling = false;
            openQuestionModal(lastIndex);
          }, 400);
        }
      }

      rollStep();
    });

    btnReset.addEventListener('click', () => {
      if (isRolling) return;

      selectedCards.clear();
      const allCards = Array.from(cardsGrid.children);

      allCards.forEach((card, idx) => {
        setTimeout(() => {
          card.classList.remove('selected');
          card.classList.add('card-flip-anim');
          setTimeout(() => card.classList.remove('card-flip-anim'), 800);
        }, idx * 100);
      });

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 60,
          spread: 70,
          origin: { y: 0.7 }
        });
      }

      showToast('Kuis berhasil di-reset!');
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    initCards();
  </script>
</body>
</html>
